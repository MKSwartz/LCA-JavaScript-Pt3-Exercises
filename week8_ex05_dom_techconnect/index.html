<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title></title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.2.1/dist/css/bootstrap.min.css"
      integrity="sha384-GJzZqFGwb1QTTN6wy59ffF1BuGJpLSa9DkKMp0DgiMDm4iYMj70gZWKYbI706tWS"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="bg-dark text-white text-center py-5 mb-4">
      <div class="container">
        <h1 class="display-4 fw-bold">
          <i class="fas fa-hippo"></i> TechConnect Hub
        </h1>
        <p class="lead mb-0">
          Connecting developers with opportunities across Africa
        </p>
      </div>
    </header>
    <main class="container">
      <!-- TOP BAR -->
      <section id="topBar" class="mb-4">
        <div class="row align-items-center mb-3">
          <!-- Search -->
          <div class="col-12 col-md-6">
            <div class="input-group">
              <span class="input-group-text">
                <i class="fas fa-search"></i>
              </span>
              <input
                type="text"
                id="searchInput"
                class="form-control"
                placeholder="Search by name, role or skills"
              />
            </div>
          </div>
          <!-- Buttons -->
          <div class="col-12 col-md-6">
            <div class="d-flex gap-2 justify-content-md-end mt-3 mt-md-0">
              <button
                id="addDeveloperBtn"
                class="btn btn-success"
                data-bs-toggle="modal"
                data-bs-target="#addDeveloperModal"
              >
                <i class="fas fa-user-plus"></i> Add Developer
              </button>
              <button id="toggleViewBtn" class="btn btn-outline-primary">
                <i class="fas fa-table"></i> Switch to Table View
              </button>
            </div>
          </div>
        </div>

        <div class="row">
          <!-- Live Counter -->
          <div class="col text-center">
            <div class="alert alert-info text-center">
              <strong>Developers:</strong>
              <span id="developerCount">0</span>
            </div>
          </div>
        </div>
      </section>
      <!-- END OF TOP BAR -->

      <!-- DEVELOPER PROFILES -->
      <section id="developerContainer" class="row"></section>
    </main>

    <!-- ADD DEVELOPER MODAL -->
    <div class="modal fade" id="addDeveloperModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header bg-success text-white">
            <h5 class="modal-title">Add New Developer</h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>

          <form id="addDeveloperForm">
            <div class="modal-body p-4">
              <div class="mb-3">
                <label class="form-label">Name *</label>
                <input type="text" id="devName" class="form-control" required />
              </div>

              <div class="mb-3">
                <label class="form-label">Role *</label>
                <input type="text" id="devRole" class="form-control" required />
              </div>

              <div class="mb-3">
                <label class="form-label">Skills * (comma separated)</label>
                <input
                  type="text"
                  id="devSkills"
                  class="form-control"
                  placeholder="HTML, CSS, JavaScript"
                  required
                />
              </div>

              <div class="mb-3">
                <label class="form-label">Location</label>
                <input
                  type="text"
                  id="devLocation"
                  class="form-control"
                  placeholder="Cape Town"
                />
              </div>

              <div class="mb-3 form-check">
                <input
                  type="checkbox"
                  id="devAvailable"
                  class="form-check-input"
                  checked
                />
                <label class="form-check-label">Available for Hire</label>
              </div>
            </div>

            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>
              <button type="submit" class="btn btn-success">
                Add Developer
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <!-- END OF ADD DEVELOPER MODAL -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
